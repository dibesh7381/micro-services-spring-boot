name: Microservices CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.filter.outputs.changes }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check changed services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          matrix: true
          filters: |
            AuthService: 'AuthService/**'
            ProfileService: 'ProfileService/**'
            OrderService: 'OrderService/**'
            EmailService: 'EmailService/**'
            AnalyticsService: 'AnalyticsService/**'

  build-test:
    name: Build & Test Changed Services
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.matrix != '[]' && needs.detect-changes.outputs.matrix != '' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run Unit Tests
        run: mvn clean test

      - name: Build Jar
        run: mvn package -DskipTests

      - name: Upload Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-jar
          path: ${{ matrix.service }}/target/*.jar

  docker-build-push:
    name: Docker Build & Push
    needs:
      - detect-changes
      - build-test
    if: ${{ needs.detect-changes.outputs.matrix != '[]' && needs.detect-changes.outputs.matrix != '' }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Convert Service Name to Lowercase
        id: service-name
        run: |
          NAME=$(echo "${{ matrix.service }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ steps.service-name.outputs.image_name }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------
  # LOCAL DEPLOYMENT JOB (Runs on your laptop via runner)
  # -------------------------------------------------------------
  deploy-local:
    name: Deploy to Local Kubernetes
    needs:
      - detect-changes
      - docker-build-push
    if: ${{ needs.detect-changes.outputs.matrix != '[]' && needs.detect-changes.outputs.matrix != '' }}
    runs-on: self-hosted

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Apply Manifest & Restart K8s Deployment
        shell: powershell
        run: |
          # 1. Service Name Lowercase (e.g., AuthService -> authservice)
          $NAME = "${{ matrix.service }}".ToLower()
          
          # 2. Add hyphen (e.g., authservice -> auth-service)
          $DEPLOY_NAME = $NAME -replace "service", "-service"
          
          # 3. Apply updated manifest automatically from k8s folder
          kubectl apply -f k8s/$DEPLOY_NAME.yaml
          
          # 4. Trigger rollout restart to force pulling the fresh GHCR image
          kubectl rollout restart deployment/$DEPLOY_NAME -n microservices
          
          Write-Host "🚀 $DEPLOY_NAME manifest applied and rollout restarted successfully!"