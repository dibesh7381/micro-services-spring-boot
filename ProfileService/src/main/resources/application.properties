# =========================
# Application
# =========================
spring.application.name=PROFILE-SERVICE
server.port=8082

# =========================
# MySQL Database
# =========================
spring.datasource.url=jdbc:mysql://mysql:3306/profile_service_db
spring.datasource.username=root
spring.datasource.password=tuku1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =========================
# JWT
# =========================
jwt.secret=YourVeryLongSecretKeyMustBeAtLeast32CharactersLong123456

# =========================
# Kafka
# =========================
spring.kafka.bootstrap-servers=kafka:9092

# Consumer
spring.kafka.consumer.group-id=profile-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=true
spring.kafka.consumer.properties.spring.json.type.mapping=userCreated:ProfileService.com.example.ProfileService.event.UserCreatedEvent