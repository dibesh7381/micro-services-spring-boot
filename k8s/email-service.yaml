apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-service
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: email-service
  template:
    metadata:
      labels:
        app: email-service
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: email-service
          image: ghcr.io/dibesh7381/emailservice:${IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 8083
          env:
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092

---
apiVersion: v1
kind: Service
metadata:
  name: email-service
  namespace: microservices
spec:
  selector:
    app: email-service
  ports:
    - port: 80
      targetPort: 8083
  type: ClusterIP