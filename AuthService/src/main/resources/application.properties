# =========================
# Application
# =========================
spring.application.name=AUTH-SERVICE
server.port=8081

# =========================
# MySQL
# =========================
spring.datasource.url=jdbc:mysql://mysql:3306/auth_service_db
spring.datasource.username=root
spring.datasource.password=tuku1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =========================
# JWT
# =========================
jwt.secret=YourVeryLongSecretKeyMustBeAtLeast32CharactersLong123456
jwt.expiration=86400000

# =========================
# Kafka
# =========================
spring.kafka.bootstrap-servers=kafka:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=true
spring.kafka.producer.properties.spring.json.type.mapping=userCreated:AuthService.com.example.AuthService.event.UserCreatedEvent